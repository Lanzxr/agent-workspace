<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Company Agent 控制台</title>
  <style>
    :root{font:14px/1.5 system-ui,sans-serif;color:#202825;background:#f4f6f4}*{box-sizing:border-box}body{margin:0}header{height:58px;background:#183c34;color:white;display:flex;align-items:center;padding:0 24px;gap:20px}header strong{font-size:17px}main{max-width:1120px;margin:24px auto;padding:0 18px}.bar{display:flex;gap:8px;align-items:center;margin:14px 0}input,select,textarea,button{font:inherit;padding:8px 10px;border:1px solid #cbd4cf;border-radius:4px;background:white;color:inherit}button{cursor:pointer;background:#e8efeb}button.primary{background:#176b51;color:white;border-color:#176b51}button.danger{color:#9c2828}.token{width:min(420px,70vw)}nav{display:flex;gap:4px;border-bottom:1px solid #cbd4cf;margin:16px 0}nav button{border:0;background:transparent;border-radius:0;padding:10px 14px}nav button.active{border-bottom:2px solid #176b51;color:#176b51}section{display:none;padding:8px 0}section.active{display:block}.metrics{display:flex;gap:24px;flex-wrap:wrap;border-bottom:1px solid #d8dfdb;padding:15px 0}.metric{min-width:140px}small,.muted{color:#65726c}table{width:100%;border-collapse:collapse;margin:12px 0;background:white}td,th{text-align:left;padding:9px;border-bottom:1px solid #e1e6e3;vertical-align:top}th{font-weight:600;background:#edf2ef}.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 0}.form input{min-width:130px}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.status{margin-left:auto;color:#dbeae3}@media(max-width:700px){header{padding:0 14px}main{margin:12px auto;padding:0 10px}td,th{padding:6px;font-size:12px}.form>*{flex:1}}
  </style>
</head>
<body>
<header><strong>Company Agent</strong><span>控制台</span><span class="status" id="status">未连接</span></header>
<main>
  <div class="bar"><input id="token" class="token" type="password" placeholder="管理令牌"><button id="connect" class="primary">连接</button><small id="notice"></small></div>
  <nav><button class="active" data-tab="overview">状态</button><button data-tab="users">用户与绑定</button><button data-tab="schedules">定时任务</button><button data-tab="settings">联网检索</button><button data-tab="logs">日志</button></nav>
  <section id="overview" class="active"><h2>运行状态</h2><div id="metrics" class="metrics"></div><div class="bar"><button onclick="refresh()">刷新</button></div></section>
  <section id="users"><h2>用户</h2><div class="form"><input id="displayName" placeholder="显示名称"><input id="timezone" value="Asia/Shanghai" placeholder="时区"><button class="primary" onclick="createUser()">创建用户</button></div><div id="userTable"></div><h2>平台身份绑定</h2><div class="form"><input id="provider" value="qq" placeholder="平台"><input id="account" placeholder="机器人/平台账号 ID"><input id="scope" placeholder="群 ID；全局填 *"><input id="external" placeholder="平台用户 ID"><select id="userId"></select><button class="primary" onclick="bindUser()">绑定</button></div><div id="bindingTable"></div></section>
  <section id="schedules"><h2>定时任务</h2><div class="form"><input id="due" type="datetime-local"><input id="zone" value="Asia/Shanghai" placeholder="时区"><select id="sourceEvent"></select><select id="workItem"></select><input id="resumePrompt" placeholder="唤醒后继续做什么"><input id="groupOpenid" placeholder="回复群 OpenID"><button class="primary" onclick="createSchedule()">创建</button></div><div id="scheduleTable"></div></section>
  <section id="settings"><h2>DSH 联网检索</h2><label><input id="webEnabled" type="checkbox" onchange="saveWeb()">允许获准的 DSH 任务使用内置 web_search / web_fetch</label><p class="muted">设置立即保存，后续启动的 DSH 任务读取该开关。</p></section>
  <section id="logs"><h2>最近审计记录</h2><div id="logTable"></div><h2>执行日志</h2><div class="form"><input id="logWorkspace" placeholder="Workspace ID"><input id="logExecution" placeholder="Execution ID"><button onclick="loadExecutionLogs()">读取</button></div><pre id="executionLogs"></pre></section>
</main>
<script>
const $=id=>document.getElementById(id), apiToken=()=>sessionStorage.getItem('company-agent-token')||'';
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{Authorization:`Bearer ${apiToken()}`,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const x=await r.json();if(!r.ok)throw Error(x.error||r.statusText);return x}
function table(rows,cols,action){if(!rows.length)return '<p class="muted">暂无记录</p>';return `<table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(typeof c[2]==='function'?c[2](r):r[c[0]]??'')}</td>`).join('')}<td>${action?`<button class="danger" data-id="${esc(action.id(r))}" data-action="${esc(typeof action.type==='function'?action.type(r):'')}">${esc(typeof action.label==='function'?action.label(r):action.label)}</button>`:''}</td></tr>`).join('')}</tbody></table>`}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){try{const s=await api('/api/status');$('status').textContent='在线';$('metrics').innerHTML=`<div class="metric"><b>管理服务</b><br>${esc(s.service)}</div><div class="metric"><b>QQ Gateway</b><br>${esc(s.qq_gateway)}</div><div class="metric"><b>Workspace 存储</b><br>${(s.workspace_bytes/1048576).toFixed(1)} MB</div><div class="metric"><b>工作项</b><br>${esc(JSON.stringify(s.work_items))}</div><div class="metric"><b>数据目录</b><br>${esc(s.data_directory)}</div>`;const [u,b,t,w,l]=await Promise.all([api('/api/users'),api('/api/bindings'),api('/api/schedules'),api('/api/settings/web-search'),api('/api/logs')]);$('userTable').innerHTML=table(u.users,[['display_name','名称'],['user_id','用户 ID'],['time_zone','时区'],['status','状态']]);$('userId').innerHTML=u.users.map(x=>`<option value="${esc(x.user_id)}">${esc(x.display_name)} (${esc(x.user_id)})</option>`).join('');$('bindingTable').innerHTML=table(b.bindings,[['provider','平台'],['account_id','账号'],['scope_id','范围'],['external_id','外部 ID'],['user_id','内部用户']],{label:'解绑',id:x=>x.binding_id});$('scheduleTable').innerHTML=table(t.tasks,[['schedule_id','任务 ID'],['due_at','UTC 执行时间'],['status','状态'],['work_item_id','工作项'],['resume_prompt','续接提示',x=>x.payload.resume_prompt]],{label:x=>x.status==='failed'?'重试':'取消',type:x=>x.status==='failed'?'retry':'cancel',id:x=>x.schedule_id});$('webEnabled').checked=w.enabled;$('logTable').innerHTML=table(l.logs,[['created_at','时间'],['entity_type','类型'],['action','操作'],['entity_id','记录 ID'],['payload','详情',x=>JSON.stringify(x.payload)]])}catch(e){$('status').textContent='连接失败';$('notice').textContent=e.message}}
async function createUser(){await api('/api/users','POST',{display_name:$('displayName').value,time_zone:$('timezone').value});$('displayName').value='';refresh()}
async function bindUser(){await api('/api/bindings','POST',{provider:$('provider').value,account_id:$('account').value,scope_id:$('scope').value||'*',external_id:$('external').value,user_id:$('userId').value});refresh()}
async function createSchedule(){const group=$('groupOpenid').value.trim();await api('/api/schedules','POST',{due_at:$('due').value,time_zone:$('zone').value,source_event_id:$('sourceEvent').value,work_item_id:$('workItem').value,resume_prompt:$('resumePrompt').value,destination:group?{channel:'qq',group_openid:group}: {}});refresh()}
async function loadScheduleSources(){const x=await api('/api/schedule-sources');$('sourceEvent').innerHTML=x.events.map(e=>`<option value="${esc(e.event_id)}">${esc(e.event_id)} · ${esc(e.content)}</option>`).join('');$('workItem').innerHTML=x.work_items.map(w=>`<option value="${esc(w.work_item_id)}">${esc(w.title)} · ${esc(w.status)}</option>`).join('')}
async function saveWeb(){await api('/api/settings/web-search','PUT',{enabled:$('webEnabled').checked});refresh()}
async function loadExecutionLogs(){const q=new URLSearchParams({workspace_id:$('logWorkspace').value,execution_id:$('logExecution').value});const logs=await api('/api/workspace-logs?'+q);$('executionLogs').textContent=`STDOUT\n${logs.stdout}\n\nSTDERR\n${logs.stderr}`}
$('connect').onclick=()=>{sessionStorage.setItem('company-agent-token',$('token').value);$('notice').textContent='';refresh()};$('token').value=apiToken();document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');if(b.dataset.tab==='schedules')loadScheduleSources()});document.body.addEventListener('click',async e=>{const b=e.target.closest('button.danger');if(!b)return;const id=encodeURIComponent(b.dataset.id);const p=b.closest('tr').parentElement.parentElement.parentElement.id;if(p==='bindingTable')await api('/api/bindings?binding_id='+id,'DELETE');else if(p==='scheduleTable'&&b.dataset.action==='retry')await api('/api/schedules/retry','POST',{schedule_id:id});else if(p==='scheduleTable')await api('/api/schedules?schedule_id='+id,'DELETE');refresh()});if(apiToken())refresh();
</script>
</body></html>
