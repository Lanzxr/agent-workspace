<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Company Agent 控制台</title>
  <style>
    :root{font:14px/1.5 system-ui,sans-serif;color:#202825;background:#f4f6f4}
    *{box-sizing:border-box}body{margin:0}header{height:58px;background:#183c34;color:#fff;display:flex;align-items:center;padding:0 24px;gap:20px}
    header strong{font-size:17px}.status{margin-left:auto;color:#dbeae3}main{max-width:1220px;margin:24px auto;padding:0 18px}
    .bar{display:flex;gap:8px;align-items:center;margin:14px 0}input,select,textarea,button{font:inherit;padding:8px 10px;border:1px solid #cbd4cf;border-radius:4px;background:#fff;color:inherit}
    button{cursor:pointer;background:#e8efeb}button.primary{background:#176b51;color:#fff;border-color:#176b51}button.danger{color:#9c2828}.token{width:min(420px,70vw)}
    nav{display:flex;gap:4px;border-bottom:1px solid #cbd4cf;margin:16px 0;overflow:auto}nav button{border:0;background:transparent;border-radius:0;padding:10px 14px;white-space:nowrap}
    nav button.active{border-bottom:2px solid #176b51;color:#176b51}section{display:none;padding:8px 0}section.active{display:block}
    .muted,small{color:#65726c}.metrics{display:flex;gap:18px;flex-wrap:wrap;border-bottom:1px solid #d8dfdb;padding:15px 0}.metric{min-width:150px}
    .metric b{font-weight:650}.service-list{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.service-pill{padding:6px 10px;border:1px solid #d2ddd7;background:#fff;border-radius:999px}
    .conversation-shell{display:grid;grid-template-columns:minmax(260px,340px) 1fr;min-height:560px;border:1px solid #d8dfdb;background:#fff}
    .conversation-list{border-right:1px solid #d8dfdb;overflow:auto}.conversation-item{padding:14px 16px;border:0;border-bottom:1px solid #edf1ee;background:#fff;text-align:left;width:100%;cursor:pointer}
    .conversation-item:hover,.conversation-item.active{background:#eef5f1}.conversation-title{font-weight:650;display:flex;justify-content:space-between;gap:8px}.conversation-preview{color:#65726c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
    .chat-pane{display:flex;flex-direction:column;min-width:0}.chat-header{padding:14px 18px;border-bottom:1px solid #d8dfdb}.chat-header strong{display:block}.chat-messages{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:12px;flex:1;background:#fbfcfb}
    .message{max-width:min(760px,88%);padding:10px 12px;border:1px solid #d7e1db;background:#fff;border-radius:8px;cursor:pointer;text-align:left}.message.user{align-self:flex-start}.message.agent{align-self:flex-end;background:#edf7f1}
    .message-meta{display:flex;gap:8px;align-items:center;color:#65726c;font-size:12px;margin-bottom:4px}.message-body{white-space:pre-wrap;overflow-wrap:anywhere}.message-attachment{display:inline-block;margin-top:7px;padding:3px 7px;background:#f1f4f2;border-radius:3px;color:#486357;font-size:12px}
    .status-chip{display:inline-block;padding:2px 7px;border-radius:999px;background:#edf1ee;color:#53655c;font-size:12px;white-space:nowrap}.status-chip.progress{background:#fff4d9;color:#795c19}.status-chip.done{background:#e2f4e9;color:#1f6948}.status-chip.failed{background:#fde9e7;color:#a13b32}
    .empty{padding:32px;color:#65726c;text-align:center}.detail-backdrop{display:none;position:fixed;inset:0;background:rgba(20,35,29,.28);z-index:10}.detail-backdrop.open{display:block}
    .detail-panel{position:absolute;right:0;top:0;height:100%;width:min(620px,94vw);background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.12);padding:22px;overflow:auto}.detail-close{float:right;border:0;background:transparent;font-size:20px;padding:2px 8px}
    .detail-panel h2{margin:0 36px 4px 0}.detail-subtitle{color:#65726c;margin-bottom:18px}.detail-section{border-top:1px solid #e2e8e4;padding:14px 0}.timeline{border-left:2px solid #c9ded2;padding-left:16px}.timeline-item{position:relative;padding:0 0 14px}.timeline-item:before{content:"";position:absolute;left:-22px;top:5px;width:8px;height:8px;border-radius:50%;background:#176b51}.timeline-time{font-size:12px;color:#65726c}.timeline-label{font-weight:600}.id-grid{display:grid;grid-template-columns:130px 1fr;gap:7px;font-size:13px}.id-grid code{overflow-wrap:anywhere;color:#486357}
    table{width:100%;border-collapse:collapse;margin:12px 0;background:#fff}td,th{text-align:left;padding:9px;border-bottom:1px solid #e1e6e3;vertical-align:top}th{font-weight:600;background:#edf2ef}
    .form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 0}.form input{min-width:130px}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;background:#fff;padding:12px;border:1px solid #d8dfdb}
    @media(max-width:760px){header{padding:0 14px}main{margin:12px auto;padding:0 10px}.conversation-shell{grid-template-columns:1fr}.conversation-list{max-height:240px;border-right:0;border-bottom:1px solid #d8dfdb}.chat-messages{min-height:360px}.message{max-width:96%}td,th{padding:6px;font-size:12px}.form>*{flex:1}}
  </style>
</head>
<body>
<header><strong>Company Agent</strong><span>中控台</span><span class="status" id="status">未连接</span></header>
<main>
  <div class="bar"><input id="token" class="token" type="password" placeholder="管理令牌"><button id="connect" class="primary">连接</button><small id="notice"></small></div>
  <nav>
    <button class="active" data-tab="conversations">对话</button><button data-tab="overview">系统状态</button><button data-tab="users">用户与绑定</button>
    <button data-tab="schedules">定时任务</button><button data-tab="settings">联网检索</button><button data-tab="logs">日志</button>
  </nav>

  <section id="conversations" class="active">
    <div class="bar"><div><h2 style="margin:0">对话</h2><small>默认只显示消息和处理状态，点击消息查看完整链路。</small></div><button onclick="loadConversations()">刷新</button></div>
    <div class="conversation-shell"><aside id="conversationList" class="conversation-list"></aside><div class="chat-pane"><div id="chatHeader" class="chat-header"><strong>选择一个会话</strong><small>收到的消息会显示在这里</small></div><div id="chatMessages" class="chat-messages"><div class="empty">暂无会话</div></div></div></div>
  </section>

  <section id="overview"><h2>系统状态</h2><div id="serviceList" class="service-list"></div><div id="metrics" class="metrics"></div><h3>当前 DSH 任务</h3><div id="activeDsh"></div><div class="bar"><button onclick="refresh()">刷新</button></div></section>
  <section id="users"><h2>用户</h2><div class="form"><input id="displayName" placeholder="显示名称"><input id="timezone" value="Asia/Shanghai" placeholder="时区"><button class="primary" onclick="createUser()">创建用户</button></div><div id="userTable"></div><h2>平台身份绑定</h2><div class="form"><input id="provider" value="qq" placeholder="平台"><input id="account" placeholder="机器人/平台账号 ID"><input id="scope" placeholder="群 ID；全局填 *"><input id="external" placeholder="平台用户 ID"><select id="userId"></select><button class="primary" onclick="bindUser()">绑定</button></div><div id="bindingTable"></div></section>
  <section id="schedules"><h2>定时任务</h2><div class="form"><input id="due" type="datetime-local"><input id="zone" value="Asia/Shanghai" placeholder="时区"><select id="sourceEvent"></select><select id="workItem"></select><input id="resumePrompt" placeholder="唤醒后继续做什么"><input id="groupOpenid" placeholder="回复群 OpenID"><button class="primary" onclick="createSchedule()">创建</button></div><div id="scheduleTable"></div></section>
  <section id="settings"><h2>联网检索权限</h2><label><input id="dssuperagentWebEnabled" type="checkbox" onchange="saveWebSetting('dssuperagent-web-search','dssuperagentWebEnabled')">允许 DSSuperAgent 派出的 worker 通过 Company Agent 受控网关搜索和读取网页</label><br><label><input id="dshWebEnabled" type="checkbox" onchange="saveWebSetting('dsh-web-search','dshWebEnabled')">允许 Company Agent 启动的独立 DSH 任务使用内置 web_search / web_fetch</label><p id="webSettingsStatus" class="muted">worker 每次搜索前都会读取此开关，变更立即生效；两个权限相互独立。</p></section>
  <section id="logs"><h2>最近审计记录</h2><div id="logTable"></div><h2>执行日志</h2><div class="form"><input id="logWorkspace" placeholder="Workspace ID"><input id="logExecution" placeholder="Execution ID"><button onclick="loadExecutionLogs()">读取</button></div><pre id="executionLogs"></pre></section>
</main>
<div id="detailBackdrop" class="detail-backdrop"><aside class="detail-panel"><button class="detail-close" onclick="closeTrace()" aria-label="关闭">×</button><div id="detailContent"></div></aside></div>
<script>
const $=id=>document.getElementById(id), apiToken=()=>sessionStorage.getItem('company-agent-token')||'';
let selectedConversationId='';
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{Authorization:`Bearer ${apiToken()}`,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const x=await r.json();if(!r.ok)throw Error(x.error||r.statusText);return x}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtTime(x){if(!x)return '';const d=new Date(x);return Number.isNaN(d.getTime())?String(x):d.toLocaleString()}
function statusClass(status){if(String(status).includes('fail')||status==='timed_out')return 'failed';if(['completed','sent','succeeded'].includes(status))return 'done';if(['received','observed','filtered'].includes(status))return '';return 'progress'}
function chip(status,label){return `<span class="status-chip ${statusClass(status)}">${esc(label||status)}</span>`}
function table(rows,cols,action){if(!rows.length)return '<p class="muted">暂无记录</p>';return `<table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(typeof c[2]==='function'?c[2](r):r[c[0]]??'')}</td>`).join('')}<td>${action?`<button class="danger" data-id="${esc(action.id(r))}" data-action="${esc(typeof action.type==='function'?action.type(r):'')}">${esc(typeof action.label==='function'?action.label(r):action.label)}</button>`:''}</td></tr>`).join('')}</tbody></table>`}
function renderServices(s){const active=s.active_dsh||[];const dsh=active.some(x=>x.status==='running')?'执行中':active.length?'排队中':'空闲';$('serviceList').innerHTML=[['QQ Gateway',s.qq_gateway],['Company Agent',s.service],['DSSuperAgent','由运行记录反映'],['DSH',dsh],['AnythingLLM','由资料库状态页查看']].map(x=>`<span class="service-pill"><b>${esc(x[0])}</b> ${esc(x[1])}</span>`).join('')}
function renderActiveDsh(rows){if(!rows.length){$('activeDsh').innerHTML='<p class="muted">当前没有排队或执行中的 DSH 任务。</p>';return}$('activeDsh').innerHTML=table(rows,[['execution_id','Execution ID'],['work_item_id','Work Item'],['status','状态',x=>x.status==='running'?'执行中':'已排队'],['workspace_id','Workspace'],['updated_at','最近更新',x=>fmtTime(x.updated_at)]]);}
function renderConversations(conversations){const list=$('conversationList');if(!conversations.length){list.innerHTML='<div class="empty">暂无收到的消息</div>';$('chatHeader').innerHTML='<strong>暂无会话</strong><small>收到的消息会显示在这里</small>';$('chatMessages').innerHTML='<div class="empty">暂无会话</div>';return}if(!selectedConversationId||!conversations.some(x=>x.conversation_id===selectedConversationId))selectedConversationId=conversations[0].conversation_id;list.innerHTML=conversations.map(c=>{const last=[...c.messages].reverse().find(x=>x.kind==='user')||c.messages[c.messages.length-1];return `<button class="conversation-item ${c.conversation_id===selectedConversationId?'active':''}" data-conversation="${esc(c.conversation_id)}"><span class="conversation-title"><span>${esc(c.label)}</span>${chip(last?.status||'',last?.status_label||'')}</span><span class="conversation-preview">${esc(last?.content||'')}</span><small>${esc(fmtTime(c.last_activity_at))}</small></button>`}).join('');const current=conversations.find(x=>x.conversation_id===selectedConversationId);renderConversation(current)}
function renderConversation(conversation){if(!conversation)return;$('chatHeader').innerHTML=`<strong>${esc(conversation.label)}</strong><small>${esc(conversation.conversation_id)}</small>`;$('chatMessages').innerHTML=conversation.messages.map(m=>`<button class="message ${m.kind}" data-event-id="${esc(m.event_id)}"><span class="message-meta"><span>${m.kind==='agent'?'Company Agent':esc(m.actor_id)}</span><span>${esc(fmtTime(m.occurred_at))}</span>${chip(m.status,m.status_label)}</span><span class="message-body">${esc(m.content||'(附件)')}</span>${(m.attachments||[]).map(a=>`<span class="message-attachment">附件：${esc(a.filename||a.name||'未命名')}</span>`).join('')}</button>`).join('')||'<div class="empty">暂无消息</div>'}
async function loadConversations(){try{const data=await api('/api/conversations?limit=50');renderConversations(data.conversations||[])}catch(e){$('notice').textContent=e.message}}
async function openTrace(eventId){try{const x=await api('/api/message-trace?event_id='+encodeURIComponent(eventId));$('detailContent').innerHTML=`<h2>消息详情</h2><div class="detail-subtitle">${esc(fmtTime(x.occurred_at))} · ${esc(x.source_type)} · ${chip(x.status,x.status_label)}</div><div class="detail-section"><b>用户消息</b><p class="message-body">${esc(x.content||'(附件)')}</p>${(x.attachments||[]).map(a=>`<span class="message-attachment">附件：${esc(a.filename||a.name||'未命名')} · ${esc(a.status||'已收到')}</span>`).join('')}</div><div class="detail-section"><b>处理进度</b><div class="timeline">${(x.timeline||[]).map(t=>`<div class="timeline-item"><div class="timeline-time">${esc(fmtTime(t.created_at))}</div><div class="timeline-label">${esc(t.label)}</div></div>`).join('')||'<div class="muted">暂无处理记录</div>'}</div></div><div class="detail-section"><b>关联对象</b><div class="id-grid"><span>消息 ID</span><code>${esc(x.event_id)}</code><span>Work</span><code>${esc(x.work_item?.work_item_id||'尚未创建')}</code><span>Execution</span><code>${esc((x.executions||[]).map(e=>e.execution_id).join(', ')||'尚未创建')}</code><span>Workspace</span><code>${esc((x.executions||[]).map(e=>e.workspace_id).filter(Boolean).join(', ')||x.assistant_run?.workspace_id||'尚未创建')}</code><span>回复</span><code>${esc((x.outbox||[]).map(o=>o.status).join(', ')||'尚未生成')}</code></div></div>`;$('detailBackdrop').classList.add('open')}catch(e){$('notice').textContent=e.message}}
function closeTrace(){$('detailBackdrop').classList.remove('open')}
async function refresh(){try{const s=await api('/api/status');$('status').textContent='在线';$('notice').textContent='';renderServices(s);renderActiveDsh(s.active_dsh||[]);$('metrics').innerHTML=`<div class="metric"><b>工作项</b><br>${esc(JSON.stringify(s.work_items||{}))}</div><div class="metric"><b>DSSuperAgent 运行</b><br>${esc(JSON.stringify(s.dssuperagent_runs||{}))}</div><div class="metric"><b>DSH 执行</b><br>${esc(JSON.stringify(s.dsh_executions||{}))}</div><div class="metric"><b>Workspace 存储</b><br>${(s.workspace_bytes/1048576).toFixed(1)} MB</div><div class="metric"><b>数据目录</b><br>${esc(s.data_directory)}</div>`;await loadConversations();const [u,b,t,w,l]=await Promise.all([api('/api/users'),api('/api/bindings'),api('/api/schedules'),api('/api/settings/web-search'),api('/api/logs')]);$('userTable').innerHTML=table(u.users,[['display_name','名称'],['user_id','用户 ID'],['time_zone','时区'],['status','状态']]);$('userId').innerHTML=u.users.map(x=>`<option value="${esc(x.user_id)}">${esc(x.display_name)} (${esc(x.user_id)})</option>`).join('');$('bindingTable').innerHTML=table(b.bindings,[['provider','平台'],['account_id','账号'],['scope_id','范围'],['external_id','外部 ID'],['user_id','内部用户']],{label:'解绑',id:x=>x.binding_id});$('scheduleTable').innerHTML=table(t.tasks,[['schedule_id','任务 ID'],['due_at','UTC 执行时间'],['status','状态'],['work_item_id','工作项'],['resume_prompt','续接提示',x=>x.payload.resume_prompt]],{label:x=>x.status==='failed'?'重试':'取消',type:x=>x.status==='failed'?'retry':'cancel',id:x=>x.schedule_id});$('dssuperagentWebEnabled').checked=w.dssuperagent_enabled;$('dshWebEnabled').checked=w.dsh_enabled;$('logTable').innerHTML=table(l.logs,[['created_at','时间'],['entity_type','类型'],['action','操作'],['entity_id','记录 ID'],['payload','详情',x=>JSON.stringify(x.payload)]])}catch(e){$('status').textContent='连接失败';$('notice').textContent=e.message}}
async function createUser(){await api('/api/users','POST',{display_name:$('displayName').value,time_zone:$('timezone').value});$('displayName').value='';refresh()}
async function bindUser(){await api('/api/bindings','POST',{provider:$('provider').value,account_id:$('account').value,scope_id:$('scope').value||'*',external_id:$('external').value,user_id:$('userId').value});refresh()}
async function createSchedule(){const group=$('groupOpenid').value.trim();await api('/api/schedules','POST',{due_at:$('due').value,time_zone:$('zone').value,source_event_id:$('sourceEvent').value,work_item_id:$('workItem').value,resume_prompt:$('resumePrompt').value,destination:group?{channel:'qq',group_openid:group}:{}});refresh()}
async function loadScheduleSources(){const x=await api('/api/schedule-sources');$('sourceEvent').innerHTML=x.events.map(e=>`<option value="${esc(e.event_id)}">${esc(e.event_id)} · ${esc(e.content)}</option>`).join('');$('workItem').innerHTML=x.work_items.map(w=>`<option value="${esc(w.work_item_id)}">${esc(w.title)} · ${esc(w.status)}</option>`).join('')}
async function saveWebSetting(setting,inputId){const input=$(inputId),previous=!input.checked;input.disabled=true;$('notice').textContent='';$('webSettingsStatus').textContent='正在保存…';try{const saved=await api('/api/settings/'+setting,'PUT',{enabled:input.checked});input.checked=saved.enabled;$('webSettingsStatus').textContent='已保存，worker 下一次搜索立即生效'}catch(e){try{input.checked=(await api('/api/settings/'+setting)).enabled}catch{input.checked=previous}$('notice').textContent='联网权限保存失败：'+e.message;$('webSettingsStatus').textContent='保存失败，当前开关状态已重新读取'}finally{input.disabled=false}}
async function loadExecutionLogs(){const q=new URLSearchParams({workspace_id:$('logWorkspace').value,execution_id:$('logExecution').value});const logs=await api('/api/workspace-logs?'+q);$('executionLogs').textContent=`STDOUT\n${logs.stdout}\n\nSTDERR\n${logs.stderr}`}
$('connect').onclick=()=>{sessionStorage.setItem('company-agent-token',$('token').value);$('notice').textContent='';refresh()};$('token').value=apiToken();document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');if(b.dataset.tab==='schedules')loadScheduleSources()});document.getElementById('conversationList').addEventListener('click',e=>{const item=e.target.closest('[data-conversation]');if(item){selectedConversationId=item.dataset.conversation;loadConversations()}});document.getElementById('chatMessages').addEventListener('click',e=>{const item=e.target.closest('[data-event-id]');if(item)openTrace(item.dataset.eventId)});document.getElementById('detailBackdrop').addEventListener('click',e=>{if(e.target.id==='detailBackdrop')closeTrace()});document.body.addEventListener('click',async e=>{const b=e.target.closest('button.danger');if(!b)return;const id=encodeURIComponent(b.dataset.id);const p=b.closest('tr').parentElement.parentElement.parentElement.id;if(p==='bindingTable')await api('/api/bindings?binding_id='+id,'DELETE');else if(p==='scheduleTable'&&b.dataset.action==='retry')await api('/api/schedules/retry','POST',{schedule_id:id});else if(p==='scheduleTable')await api('/api/schedules?schedule_id='+id,'DELETE');refresh()});if(apiToken())refresh();setInterval(()=>{if(apiToken())refresh()},5000);
</script>
</body>
</html>
