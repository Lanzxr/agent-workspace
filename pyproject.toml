[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-agent-control-plane"
version = "0.1.0"
description = "Generic Company Agent control plane, persistent workspaces, and DSH execution"
requires-python = ">=3.11"
dependencies = ["websockets>=12,<17", "tzdata>=2025.2; sys_platform == 'win32'"]

[project.optional-dependencies]
attachments = ["pypdf>=5,<7"]

[project.scripts]
company-agent = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["dsh_plugins/*.mjs"]

[tool.setuptools.data-files]
"share/company-agent/web" = ["web/index.html"]
