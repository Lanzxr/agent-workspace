[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-agent-control-plane"
version = "0.1.0"
description = "Generic Company Agent control plane, persistent workspaces, and DSH execution"
requires-python = ">=3.11"

[project.scripts]
company-agent = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]
